<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-label="Jim G">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="55%" stop-color="#07090c"/>
      <stop offset="100%" stop-color="#061016"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f4f5"/>
      <stop offset="70%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#3dd6c6"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0099cc" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3dd6c6"/>
      <stop offset="100%" stop-color="#0099cc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0099cc"/>
      <stop offset="100%" stop-color="#3dd6c6"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="300" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1098" height="298" rx="17" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <ellipse cx="160" cy="70" rx="240" ry="130" fill="#0099cc" opacity="0.14">
    <animate attributeName="opacity" values="0.10;0.20;0.10" dur="7s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="980" cy="250" rx="260" ry="140" fill="#3dd6c6" opacity="0.12">
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="8s" repeatCount="indefinite"/>
  </ellipse>

  <g stroke="rgba(255,255,255,0.035)" stroke-width="1">
    <path d="M0 60 H1100"/><path d="M0 120 H1100"/><path d="M0 180 H1100"/><path d="M0 240 H1100"/>
    <path d="M140 0 V300"/><path d="M320 0 V300"/><path d="M550 0 V300"/><path d="M780 0 V300"/><path d="M960 0 V300"/>
  </g>

  <rect x="430" y="28" width="240" height="26" rx="13" fill="rgba(61,214,198,0.10)" stroke="rgba(61,214,198,0.35)"/>
  <text x="550" y="46" text-anchor="middle" fill="#3dd6c6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="3.2">FIVEM  ·  3D  ·  WEB</text>

  <text x="550" y="155" text-anchor="middle" fill="url(#name)" font-family="Segoe UI, Arial Black, Helvetica, sans-serif" font-size="86" font-weight="800" letter-spacing="10">JIM G</text>
  <rect x="355" y="176" width="390" height="2" fill="url(#line)"/>

  <text x="550" y="214" text-anchor="middle" fill="#c8c8ce" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="3.4">3D MODELER  &amp;  SCRIPT CREATOR</text>
  <text x="550" y="248" text-anchor="middle" fill="#71717a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.6">Premium FiveM resources  ·  jim-g.com</text>
